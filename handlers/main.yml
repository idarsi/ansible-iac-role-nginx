###############################################################################
#
# main.yml
#
# @author Arsi Atomi
#
###############################################################################

- name: "Check Nginx service state before reload"
  ansible.builtin.service_facts:
  listen: "Validate Nginx configuration"

- name: "Validate Nginx configuration"
  ansible.builtin.include_tasks: "../tasks/nginx_config_test.yml"
  vars:
    nginx_validation_reload: true
  when: nginx_state | default('') not in ['absent', 'uninstall']
  listen: "Validate Nginx configuration"

- name: "Reload Nginx"
  ansible.builtin.systemd_service:
    name: "{{ iac_service_name }}"
    state: "reloaded"
  when: >-
    ((ansible_facts.services | default({})).get(
    iac_service_name,
    (ansible_facts.services | default({})).get(iac_service_name + '.service', {})).state |
    default('stopped')) == 'running'
  listen: "Reload Nginx"
