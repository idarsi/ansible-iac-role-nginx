---
- name: "Check Nginx service state before reload"
  ansible.builtin.service_facts:
  listen: "Validate Nginx configuration"

- name: "Validate Nginx configuration"
  ansible.builtin.command: "/usr/sbin/nginx -t"
  # This handler only runs after a notifying task changed configuration. Marking
  # successful validation changed is what queues the dependent reload handler.
  changed_when: true
  when: nginx_state | default('') not in ['absent', 'uninstall']
  listen: "Validate Nginx configuration"
  notify: "Reload Nginx"

- name: "Reload Nginx"
  ansible.builtin.systemd_service:
    name: "{{ iac_service_name }}"
    state: "reloaded"
  when: >-
    ((ansible_facts.services | default({})).get(
    iac_service_name,
    (ansible_facts.services | default({})).get(iac_service_name + '.service', {})).state |
    default('stopped')) == 'running'
  listen: "Reload Nginx"
