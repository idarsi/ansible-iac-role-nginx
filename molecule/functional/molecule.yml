---
driver:
  name: "podman"
platforms:
  - name: "rocky9"
    image: "docker.io/rockylinux/rockylinux:9-ubi-init"
    pre_build_image: true
    privileged: true
    command: "/usr/lib/systemd/systemd"
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      interpreter_python: "auto_silent"
verifier:
  name: "ansible"
scenario:
  name: "functional"
  test_sequence:
    - "syntax"
    - "create"
    - "converge"
    - "idempotence"
    - "verify"
    - "destroy"
