---
driver:
  name: "default"
  safe_files:
    - "${MOLECULE_EPHEMERAL_DIRECTORY}/collections/*"
  options:
    managed: true
platforms:
  - name: "nginx-validation-rocky9"
    image: "docker.io/rockylinux/rockylinux:9-ubi-init"
    pre_build_image: true
    command: ["sleep", "infinity"]
provisioner:
  name: "ansible"
  env:
    IDARSI_MOLECULE_BACKEND: "podman"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  playbooks:
    create: "${IDARSI_TEST_ENVIRONMENT}/molecule/managed/create.yml"
    destroy: "${IDARSI_TEST_ENVIRONMENT}/molecule/managed/destroy.yml"
  config_options:
    defaults:
      interpreter_python: "auto_silent"
      # The validation image has a writable /tmp; do not rely on the remote
      # user's home directory for Ansible's temporary files.
      remote_tmp: "/tmp/.ansible/tmp"
verifier:
  name: "ansible"
