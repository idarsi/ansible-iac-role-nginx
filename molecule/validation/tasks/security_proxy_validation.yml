---
- name: "Accept a boolean false site proxy SSL override"
  ansible.builtin.include_role:
    name: "{{ playbook_dir | dirname | dirname }}"
  vars:
    state: "validate"
    iac_blueprint:
      nginx:
        sites:
          - name: "boolean-site.example.org"
            autoconfigure: "proxy"
            proxy_pass: "https://127.0.0.1:8443"
            proxy_ssl_verify: false
            locations:
              - path: "/health"
                autoconfigure: "proxy"
                redirect_to: "https://127.0.0.1:8443/health"
                proxy_ssl_verify: false

- name: "Reject a string site proxy SSL override"
  block:
    - name: "Validate the invalid string site override"
      ansible.builtin.include_role:
        name: "{{ playbook_dir | dirname | dirname }}"
      vars:
        state: "validate"
        iac_blueprint:
          nginx:
            sites:
              - name: "string-site.example.org"
                autoconfigure: "proxy"
                proxy_pass: "https://127.0.0.1:8443"
                proxy_ssl_verify: "false"
  rescue:
    - name: "Record the expected string site override rejection"
      ansible.builtin.set_fact:
        security_validation_string_site_rejected: true
        security_validation_string_site_code: "{{ nginx_validation_error_code | default('') }}"

- name: "Reject a string location proxy SSL override"
  block:
    - name: "Validate the invalid string location override"
      ansible.builtin.include_role:
        name: "{{ playbook_dir | dirname | dirname }}"
      vars:
        state: "validate"
        iac_blueprint:
          nginx:
            sites:
              - name: "string-location.example.org"
                autoconfigure: "proxy"
                proxy_pass: "https://127.0.0.1:8443"
                locations:
                  - path: "/private"
                    autoconfigure: "proxy"
                    redirect_to: "https://127.0.0.1:8443/private"
                    proxy_ssl_verify: "false"
  rescue:
    - name: "Record the expected string location override rejection"
      ansible.builtin.set_fact:
        security_validation_string_location_rejected: true
        security_validation_string_location_code: "{{ nginx_validation_error_code | default('') }}"

- name: "Reject injected site proxy access control"
  block:
    - name: "Validate the injected site access-control value"
      ansible.builtin.include_role:
        name: "{{ playbook_dir | dirname | dirname }}"
      vars:
        state: "validate"
        iac_blueprint:
          nginx:
            sites:
              - name: "injected-access.example.org"
                autoconfigure: "proxy"
                proxy_pass: "https://127.0.0.1:8443"
                deny: "all; add_header X-Leak yes"
  rescue:
    - name: "Record the expected site access-control rejection"
      ansible.builtin.set_fact:
        security_validation_injected_access_rejected: true
        security_validation_injected_access_code: "{{ nginx_validation_error_code | default('') }}"

- name: "Reject an unsafe auth_basic_user_file path"
  block:
    - name: "Validate the unsafe auth_basic_user_file path"
      ansible.builtin.include_role:
        name: "{{ playbook_dir | dirname | dirname }}"
      vars:
        state: "validate"
        iac_blueprint:
          nginx:
            sites:
              - name: "unsafe-auth-path.example.org"
                autoconfigure: "proxy"
                proxy_pass: "https://127.0.0.1:8443"
                auth_basic_user_file: "/etc/shadow"
  rescue:
    - name: "Record the expected auth_basic_user_file rejection"
      ansible.builtin.set_fact:
        security_validation_unsafe_auth_path_rejected: true
        security_validation_unsafe_auth_path_code: "{{ nginx_validation_error_code | default('') }}"

- name: "Reject invalid server access control before generic server validation"
  block:
    - name: "Validate a server with injected access control"
      ansible.builtin.include_role:
        name: "{{ playbook_dir | dirname | dirname }}"
      vars:
        state: "validate"
        iac_blueprint:
          nginx:
            sites:
              - name: "invalid-server-access.example.org"
                autoconfigure: "none"
                ssl_certificate_type: "none"
                servers:
                  - listen: "8080"
                    deny: "all; return 200"
  rescue:
    - name: "Record the expected server access-control error code"
      ansible.builtin.set_fact:
        security_validation_server_access_rejected: true
        security_validation_server_access_code: "{{ nginx_validation_error_code | default('') }}"

- name: "Reject unsupported proxy-location directives"
  block:
    - name: "Validate a proxy location with a forbidden return directive"
      ansible.builtin.include_role:
        name: "{{ playbook_dir | dirname | dirname }}"
      vars:
        state: "validate"
        iac_blueprint:
          nginx:
            sites:
              - name: "unsupported-location.example.org"
                autoconfigure: "proxy"
                proxy_pass: "https://127.0.0.1:8443"
                locations:
                  - path: "/bad"
                    autoconfigure: "proxy"
                    redirect_to: "https://127.0.0.1:8443/bad"
                    return: "200 injected"
  rescue:
    - name: "Record the expected unsupported proxy directive rejection"
      ansible.builtin.set_fact:
        security_validation_unsupported_location_rejected: true
        security_validation_unsupported_location_code: "{{ nginx_validation_error_code | default('') }}"

- name: "Render HTTPS proxy security defaults and overrides"
  ansible.builtin.set_fact:
    security_validation_https_default: >-
      {{ lookup('template', (playbook_dir | dirname | dirname) ~ '/templates/site_proxy_443.j2', template_vars={
      'nginx_site': {'name': 'default.example.org', 'proxy_pass': 'https://backend.example.org', 'deny': '192.0.2.0/24', 'allow': 'all', 'auth_basic': 'off'},
      'nginx_public_key_directory': '/etc/pki/tls/certs',
      'nginx_private_key_directory': '/etc/pki/tls/private',
      'nginx_proxy_ssl_verify': true,
      'nginx_render_locations': true}) }}
    security_validation_https_override: >-
      {{ lookup('template', (playbook_dir | dirname | dirname) ~ '/templates/site_proxy_443.j2', template_vars={
      'nginx_site': {'name': 'override.example.org', 'proxy_pass': 'https://backend.example.org', 'proxy_ssl_verify': false},
      'nginx_public_key_directory': '/etc/pki/tls/certs',
      'nginx_private_key_directory': '/etc/pki/tls/private',
       'nginx_proxy_ssl_verify': true,
       'nginx_render_locations': true}) }}
    security_validation_https_location_default: >-
      {{ lookup('template', (playbook_dir | dirname | dirname) ~ '/templates/site_proxy_443.j2', template_vars={
      'nginx_site': {'name': 'location-default.example.org', 'proxy_pass': 'https://backend.example.org',
      'locations': [{'path': '/health', 'redirect_to': 'https://backend.example.org/health'}]},
      'nginx_public_key_directory': '/etc/pki/tls/certs',
      'nginx_private_key_directory': '/etc/pki/tls/private',
      'nginx_proxy_ssl_verify': true,
      'nginx_render_locations': true}) }}
    security_validation_https_location_site_override: >-
      {{ lookup('template', (playbook_dir | dirname | dirname) ~ '/templates/site_proxy_443.j2', template_vars={
      'nginx_site': {'name': 'location-site-override.example.org', 'proxy_pass': 'https://backend.example.org',
      'proxy_ssl_verify': false, 'locations': [{'path': '/health', 'redirect_to': 'https://backend.example.org/health'}]},
      'nginx_public_key_directory': '/etc/pki/tls/certs',
      'nginx_private_key_directory': '/etc/pki/tls/private',
      'nginx_proxy_ssl_verify': true,
      'nginx_render_locations': true}) }}
    security_validation_https_location_override: >-
      {{ lookup('template', (playbook_dir | dirname | dirname) ~ '/templates/site_proxy_443.j2', template_vars={
      'nginx_site': {'name': 'location-override.example.org', 'proxy_pass': 'https://backend.example.org',
      'locations': [{'path': '/health', 'redirect_to': 'https://backend.example.org/health', 'proxy_ssl_verify': false}]},
      'nginx_public_key_directory': '/etc/pki/tls/certs',
      'nginx_private_key_directory': '/etc/pki/tls/private',
      'nginx_proxy_ssl_verify': true,
      'nginx_render_locations': true}) }}
    security_validation_http_access: >-
      {{ lookup('template', (playbook_dir | dirname | dirname) ~ '/templates/site_proxy_http.j2', template_vars={
       'nginx_site': {'name': 'access.example.org', 'proxy_pass': 'http://backend.example.org',
        'locations': [{'path': '/private', 'deny': '192.0.2.0/24', 'allow': 'all', 'auth_basic': false}]},
       'nginx_render_locations': true}) }}
    security_validation_manual_location: >-
      {{ lookup('template', (playbook_dir | dirname | dirname) ~ '/templates/site.j2', template_vars={
       'nginx_site': {'name': 'manual.example.org',
       'servers': [{'listen': '8080', 'locations': [{'path': '/manual',
       'redirect_to': 'http://backend.example.org/manual', 'proxy_ssl_verify': false}]}]},
      'nginx_render_locations': true}) }}

- name: "Verify proxy SSL override validation"
  ansible.builtin.assert:
    that:
      - security_validation_string_site_rejected | default(false) | bool
      - security_validation_string_location_rejected | default(false) | bool
      - security_validation_injected_access_rejected | default(false) | bool
      - security_validation_injected_access_code == "SITE_PROXY_ACCESS_CONTROL_UNSAFE"
      - security_validation_unsafe_auth_path_rejected | default(false) | bool
      - security_validation_unsafe_auth_path_code == "SITE_PROXY_ACCESS_CONTROL_UNSAFE"
      - security_validation_server_access_rejected | default(false) | bool
      - security_validation_server_access_code == "SERVER_ACCESS_CONTROL_INVALID"
      - security_validation_unsupported_location_rejected | default(false) | bool
      - security_validation_unsupported_location_code == "LOCATION_ACCESS_CONTROL_INVALID"
      - security_validation_string_site_code == "SITE_PROXY_SSL_VERIFY_INVALID"
      - security_validation_string_location_code == "LOCATION_PROXY_SSL_VERIFY_INVALID"
      - "'proxy_ssl_verify on;' in security_validation_https_default"
      - "'proxy_ssl_server_name on;' in security_validation_https_default"
      - "'proxy_ssl_verify on;' in security_validation_https_location_default"
      - "'proxy_ssl_server_name on;' in security_validation_https_location_default"
      - "'proxy_ssl_verify off;' in security_validation_https_location_site_override"
      - "'proxy_ssl_server_name on;' in security_validation_https_location_site_override"
      - "'proxy_ssl_verify off;' in security_validation_https_location_override"
      - "'proxy_ssl_server_name on;' in security_validation_https_location_override"
      - "'deny 192.0.2.0/24;' in security_validation_https_default"
      - "'allow all;' in security_validation_https_default"
      - "'auth_basic off;' in security_validation_https_default"
      - "'proxy_ssl_verify off;' in security_validation_https_override"
      - "'proxy_ssl_server_name on;' in security_validation_https_override"
      - "'deny 192.0.2.0/24;' in security_validation_http_access"
      - "'allow all;' in security_validation_http_access"
      - "'auth_basic off;' in security_validation_http_access"
      - "'autoconfigure' not in security_validation_http_access"
      - "'deny all;' not in security_validation_https_default"
      - "'redirect_to http://backend.example.org/manual;' in security_validation_manual_location"
      - "'proxy_ssl_verify off;' in security_validation_manual_location"
