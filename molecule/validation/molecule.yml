---
driver:
  name: "podman"
platforms:
  - name: "rocky9"
    image: "quay.io/rockylinux/rockylinux:9"
    pre_build_image: true
provisioner:
  name: "ansible"
  config_options:
    defaults:
      interpreter_python: "auto_silent"
      # The validation image has a writable /tmp; do not rely on the remote
      # user's home directory for Ansible's temporary files.
      remote_tmp: "/tmp/.ansible/tmp"
verifier:
  name: "ansible"
scenario:
  name: "validation"
  test_sequence:
    - "syntax"
    - "create"
    - "converge"
    - "verify"
    - "destroy"
