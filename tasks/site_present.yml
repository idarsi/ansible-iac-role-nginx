---
###############################################################################
#
# loop_servers.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Setting variables"
  ansible.builtin.set_fact:
    nginx_ssl_certificate_type: "{{ nginx_site.ssl_certificate_type | default(nginx_default_ssl_certificate_type) }}"
    nginx_autoconfigure: "{{ (nginx_site.autoconfigure | default(nginx_default_site_autoconfigure)) }}"

- name: "Check whether the site configuration already exists"
  ansible.builtin.stat:
    path: "{{ nginx_etc_directory }}/sites-available/{{ nginx_site.name }}"
  register: nginx_site_config_before

- name: "Check the role ownership marker for site tracking"
  ansible.builtin.stat:
    path: "{{ nginx_management_marker }}"
  register: nginx_management_marker_stat

- name: "Check the role ownership manifest for site tracking"
  ansible.builtin.stat:
    path: "{{ nginx_management_manifest }}"
  register: nginx_management_manifest_stat

- name: "Checking if required variables are defined"
  ansible.builtin.assert:
    that:
      - nginx_site.name is defined
      - nginx_site.servers is defined or nginx_autoconfigure is defined
    fail_msg: "All tests did not pass"

###############################################################################
# CREATING CONFIGURATION IF AUTOCONFIGURATION IS TRUE
###############################################################################

- name: "Configure the site with the website preset"
  ansible.builtin.include_tasks: site_present_with_website.yml
  when: nginx_autoconfigure == 'website'

- name: "Configure the site with the proxy preset"
  ansible.builtin.include_tasks: site_present_with_proxy.yml
  when: nginx_autoconfigure == 'proxy'

###############################################################################
# CREATING SITE DIRECTORIES
###############################################################################

- name: "Ensuring www directory exists"
  ansible.builtin.file:
    path: "{{ nginx_www_directory }}/{{ nginx_site.name }}/html"
    state: directory
    mode: "0755"

- name: "Ensuring www log directory exists"
  ansible.builtin.file:
    path: "{{ nginx_log_directory }}/{{ nginx_site.name }}"
    state: directory
    mode: "0755"

###############################################################################
# ENSURING THERE IS CERTIFICATE
###############################################################################

- name: "Checking for certificate"
  ansible.builtin.include_tasks: certificate_present.yml
  vars:
    nginx_server_name: "{{ nginx_site.name }}"
    nginx_ssl_certificate: "{{ nginx_public_key_directory }}/{{ nginx_site.name }}.crt"
    nginx_ssl_certificate_key: "{{ nginx_private_key_directory }}/{{ nginx_site.name }}.key"
  when: nginx_ssl_certificate_type == 'selfsigned'

###############################################################################
# LOOPING THROUGH VIRTUAL HOSTS TO BE ADDED IF SERVERS EXIST
###############################################################################

- name: "Looping through servers"
  ansible.builtin.include_tasks: "server_present.yml"
  loop: "{{ nginx_site.servers | default([]) }}"
  loop_control:
    loop_var: nginx_server
  when: (nginx_site.servers | default([]) | length) > 0

- name: "Record the site in the role ownership manifest"
  ansible.builtin.include_tasks: site_manifest_present.yml
  when:
    - not nginx_site_config_before.stat.exists
    - nginx_management_marker_stat.stat.exists | default(false)
    - nginx_management_manifest_stat.stat.exists | default(false)
