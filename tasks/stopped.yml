---
###############################################################################
#
# stopped.yml
#
###############################################################################

- name: "Gather service facts before stopping Nginx"
  ansible.builtin.service_facts:

- name: "Stop Nginx when the service is installed"
  ansible.builtin.service:
    name: "{{ iac_service_name }}"
    state: "stopped"
  when:
    - (iac_service_name + '.service') in ansible_facts.services or iac_service_name in ansible_facts.services

- name: "Write the Nginx stopped-state log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Ensured service {{ iac_service_name }} is stopped when present"
