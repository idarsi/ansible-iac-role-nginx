---
###############################################################################
#
# loop_sites.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Checking if required variables are defined"
  ansible.builtin.assert:
    that:
      - nginx_sites is defined
    fail_msg: "All tests did not pass"

###############################################################################
# LOOPING THROUGH SITES TO BE ADDED
###############################################################################

- name: "Looping through sites"
  ansible.builtin.include_tasks: "{{ nginx_loop_state }}.yml"
  loop: "{{ nginx_sites }}"
  loop_control:
    loop_var: nginx_loop_site
    label: "{{ nginx_loop_site.name | default('redacted') }}"
  vars:
    nginx_site: "{{ nginx_loop_site }}"
