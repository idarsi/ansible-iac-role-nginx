---
- name: "Check that the operating system is supported"
  ansible.builtin.fail:
    msg: "Unsupported operating system: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
  when: >-
    iac_supported_os | selectattr('name', 'equalto', ansible_facts['distribution'])
    | selectattr('versions', 'contains', ansible_facts['distribution_major_version'])
    | list | length == 0

- name: "Normalize the requested state"
  ansible.builtin.set_fact:
    nginx_state: "{{ state | default('present') | string | lower }}"

- name: "Reset role-local normalization facts"
  ansible.builtin.set_fact:
    nginx_sites: []
    nginx_blueprint_locations: []
    nginx_blueprint_servers: []
    nginx_owned_paths: []
    nginx_autoconfigure: "none"
    nginx_ssl_certificate_type: "none"
    nginx_site: {}
    nginx_loop_state: ""
    nginx_manifest_raw: {}

- name: "Reject unknown Nginx states"
  ansible.builtin.assert:
    that: nginx_state in nginx_supported_states
    fail_msg: "Unsupported Nginx state '{{ nginx_state }}'. Supported states: {{ nginx_supported_states | join(', ') }}."

- name: "Check that the blueprint is defined"
  ansible.builtin.assert:
    that:
      - iac_blueprint is defined
      - iac_blueprint.nginx is defined
    fail_msg: "iac_blueprint.nginx is required."

- name: "Validate the complete blueprint before host changes"
  ansible.builtin.include_tasks: validate.yml

- name: "Capture pre-convergence Nginx ownership state"
  ansible.builtin.stat:
    path: "{{ nginx_etc_directory }}"
  register: nginx_etc_preflight_stat

- name: "Remember whether the Nginx configuration pre-existed"
  ansible.builtin.set_fact:
    nginx_etc_preexisting: "{{ nginx_etc_preflight_stat.stat.exists }}"

- name: "Normalize configured sites"
  ansible.builtin.set_fact:
    nginx_sites: "{{ iac_blueprint.nginx.sites | default([]) }}"

- name: "Ensure site state is converged"
  ansible.builtin.include_tasks: loop_sites.yml
  vars:
    nginx_loop_state: "{{ nginx_state }}"
  when: nginx_state in ['site_present', 'site_absent', 'site_enabled', 'site_disabled', 'location_present', 'location_absent']

- name: "Install Nginx and configure it"
  ansible.builtin.include_tasks: install.yml
  when: nginx_state == 'install'

- name: "Ensure the Nginx installation is present"
  ansible.builtin.include_tasks: present.yml
  when: nginx_state == 'present'

- name: "Ensure the Nginx installation is absent"
  ansible.builtin.include_tasks: absent.yml
  when: nginx_state == 'absent'

- name: "Uninstall Nginx with explicit confirmation"
  ansible.builtin.include_tasks: uninstall.yml
  when: nginx_state == 'uninstall'

- name: "Ensure Nginx is started"
  ansible.builtin.include_tasks: started.yml
  when: nginx_state == 'started'

- name: "Ensure Nginx is stopped"
  ansible.builtin.include_tasks: stopped.yml
  when: nginx_state == 'stopped'
