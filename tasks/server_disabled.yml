---
###############################################################################
#
# server_disabled.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Checking if required variables are defined"
  ansible.builtin.assert:
    that:
      - "nginx_etc_directory is defined"
      - "nginx_server is mapping"
      - "nginx_site.name is string"
    fail_msg: "All tests did not pass"

###############################################################################
# ENSURING SERVER IS DISABLED
###############################################################################

- name: "Remove symbolic link for server"
  ansible.builtin.file:
    path: "{{ nginx_etc_directory }}/sites-enabled/{{ nginx_site.name }}"
    state: "absent"
  notify: "Validate Nginx configuration"

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Ensured {{ nginx_site.name }} was disabled"
