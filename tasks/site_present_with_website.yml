---
- name: "Set website preset variables"
  ansible.builtin.set_fact:
    nginx_autoconfigure: "{{ nginx_site.autoconfigure | default(nginx_default_site_autoconfigure) }}"
    nginx_ssl_certificate_type: "{{ nginx_site.ssl_certificate_type | default(nginx_default_ssl_certificate_type) }}"

- name: "Ensure website directories exist"
  ansible.builtin.file:
    path: "{{ nginx_www_directory }}/{{ nginx_site.name }}/html"
    state: "directory"
    mode: "0755"

- name: "Ensure website log directory exists"
  ansible.builtin.file:
    path: "{{ nginx_log_directory }}/{{ nginx_site.name }}"
    state: "directory"
    mode: "0755"

- name: "Create the self-signed certificate when TLS is enabled"
  ansible.builtin.include_tasks: certificate_present.yml
  vars:
    nginx_server_name: "{{ nginx_site.name }}"
    nginx_ssl_certificate: "{{ nginx_public_key_directory }}/{{ nginx_site.name }}.crt"
    nginx_ssl_certificate_key: "{{ nginx_private_key_directory }}/{{ nginx_site.name }}.key"
  when: nginx_ssl_certificate_type == 'selfsigned'

- name: "Render the website preset through the unified site path"
  ansible.builtin.template:
    src: "{{ 'site_website_tls.j2' if nginx_ssl_certificate_type == 'selfsigned' else 'site_website_http.j2' }}"
    dest: "{{ nginx_etc_directory }}/sites-available/{{ nginx_site.name }}"
    owner: root
    group: root
    mode: "0644"
  notify: "Validate Nginx configuration"

- name: "Remove legacy split website preset files"
  ansible.builtin.file:
    path: "{{ nginx_etc_directory }}/sites-available/{{ nginx_site.name }}_{{ nginx_legacy_suffix }}"
    state: "absent"
  loop:
    - "80"
    - "443"
  loop_control:
    loop_var: nginx_legacy_suffix
