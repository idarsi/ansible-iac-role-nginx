---
- name: "Validate the Nginx blueprint root type"
  ansible.builtin.assert:
    that:
      - iac_blueprint is mapping
      - iac_blueprint.nginx is defined
      - iac_blueprint.nginx is mapping
    fail_msg: "iac_blueprint.nginx must be a mapping."

- name: "Validate Nginx collection types"
  ansible.builtin.assert:
    that:
      # ansible-core does not expose a Jinja `is list` test; type_debug is the
      # explicit list-type check and rejects mappings, strings, and scalars.
      - (nginx_collection_value | type_debug) == 'list'
    fail_msg: >-
      iac_blueprint.nginx.{{ nginx_collection_name }} must be a list, not a
      string or another scalar; got {{ nginx_collection_value | type_debug }}.
  loop:
    - {name: "sites", value: "{{ iac_blueprint.nginx.sites | default([]) }}"}
    - {name: "directories", value: "{{ iac_blueprint.nginx.directories | default([]) }}"}
    - {name: "files", value: "{{ iac_blueprint.nginx.files | default([]) }}"}
    - {name: "binds", value: "{{ iac_blueprint.nginx.binds | default([]) }}"}
    - {name: "cron", value: "{{ iac_blueprint.nginx.cron | default([]) }}"}
  loop_control:
    loop_var: nginx_collection
  vars:
    nginx_collection_name: "{{ nginx_collection.name }}"
    nginx_collection_value: "{{ nginx_collection.value }}"

- name: "Validate Nginx site record types before normalization"
  ansible.builtin.assert:
    that:
      - nginx_site_record is mapping
      - nginx_site_record.servers | default([]) is sequence
      - nginx_site_record.servers | default([]) is not string
      - nginx_site_record.locations | default([]) is sequence
      - nginx_site_record.locations | default([]) is not string
    fail_msg: >-
      Each iac_blueprint.nginx.sites record must be a mapping with servers and
      locations lists; got {{ nginx_site_record | type_debug }}.
  loop: "{{ iac_blueprint.nginx.sites | default([]) }}"
  loop_control:
    loop_var: nginx_site_record

- name: "Validate nested Nginx record types before normalization"
  ansible.builtin.assert:
    that:
      - nginx_nested_record is mapping
    fail_msg: >-
      Nginx {{ nginx_nested_record_kind }} records must be mappings; got
      {{ nginx_nested_record | type_debug }}.
  loop: >-
    {{ (iac_blueprint.nginx.sites | default([]) | map(attribute='servers') |
    select('defined') | list | flatten) +
    (iac_blueprint.nginx.sites | default([]) | map(attribute='locations') |
    select('defined') | list | flatten) }}
  loop_control:
    loop_var: nginx_nested_record
  vars:
    nginx_nested_record_kind: "server or location"
