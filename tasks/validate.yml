---
- name: "Validate record and collection types before normalization"
  ansible.builtin.include_tasks: validate_types.yml

- name: "Build normalized Nginx location list"
  ansible.builtin.set_fact:
    nginx_blueprint_locations: >-
      {{ nginx_blueprint_locations | default([]) +
      (nginx_site_record.servers | default([]) | map(attribute='locations') |
      select('defined') | list | flatten) +
      (nginx_site_record.locations | default([])) }}
  loop: "{{ iac_blueprint.nginx.sites | default([]) }}"
  loop_control:
    loop_var: nginx_site_record
  no_log: true

- name: "Build normalized Nginx server list"
  ansible.builtin.set_fact:
    nginx_blueprint_servers: "{{ nginx_blueprint_servers | default([]) + (nginx_site_record.servers | default([])) }}"
  loop: "{{ iac_blueprint.nginx.sites | default([]) }}"
  loop_control:
    loop_var: nginx_site_record
  no_log: true

- name: "Validate the complete Nginx inventory"
  ansible.builtin.include_tasks: validate_inventory.yml
