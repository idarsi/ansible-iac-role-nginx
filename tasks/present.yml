---
###############################################################################
#
# present.yml
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Ensuring dnf plugins core is installed"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    iac_package: "dnf-plugins-core"

- name: "Ensure the role management directory exists"
  ansible.builtin.file:
    path: "{{ nginx_management_directory }}"
    state: "directory"
    owner: root
    group: root
    mode: "0700"
  when: not (nginx_etc_preexisting | bool)

- name: "Write the role ownership marker"
  ansible.builtin.copy:
    content: "ansible-iac-role-nginx\n"
    dest: "{{ nginx_management_marker }}"
    owner: root
    group: root
    mode: "0600"
  when: not (nginx_etc_preexisting | bool)

- name: "Write the role ownership manifest"
  ansible.builtin.copy:
    content: >-
      {{ {'owner': 'ansible-iac-role-nginx', 'paths': [nginx_etc_directory],
      'managed_files': [nginx_etc_directory + '/nginx.conf'], 'managed_links': [],
      'managed_directories': [nginx_etc_directory, nginx_etc_directory + '/sites-available',
      nginx_etc_directory + '/sites-enabled', nginx_www_directory, nginx_log_directory],
      'managed_sites': []} | to_nice_yaml }}
    dest: "{{ nginx_management_manifest }}"
    owner: root
    group: root
    mode: "0600"
  when: not (nginx_etc_preexisting | bool)

- name: "Ensuring openssl is installed"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    iac_package: "openssl"

###############################################################################
# ENSURING REPOSITORIES ARE PRESENT
###############################################################################

- name: "Ensuring Nginx repositories are present"
  ansible.builtin.include_tasks: repo_present.yml

- name: "Record the repository only when this role created it"
  ansible.builtin.copy:
    content: >-
      {{ {'owner': 'ansible-iac-role-nginx', 'paths': [nginx_etc_directory, iac_dnf_repo_path],
      'managed_files': [nginx_etc_directory + '/nginx.conf', iac_dnf_repo_path], 'managed_links': [],
      'managed_directories': [nginx_etc_directory, nginx_etc_directory + '/sites-available',
      nginx_etc_directory + '/sites-enabled', nginx_www_directory, nginx_log_directory],
      'managed_sites': []} | to_nice_yaml }}
    dest: "{{ nginx_management_manifest }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - nginx_repo_created_by_role | default(false) | bool
    - not (nginx_etc_preexisting | bool)

###############################################################################
# ENSURING NGINX PACKAGE IS PRESENT
###############################################################################

- name: "Ensuring nginx is installed"
  ansible.builtin.include_tasks: package_dispatch.yml
  vars:
    iac_package_state: "present"

###############################################################################
# ENSURING CONFIGURATION DIRECTORIES EXIST
###############################################################################

- name: "Ensuring repository is in place"
  ansible.builtin.template:
    src: "nginx.conf.j2"
    dest: "{{ nginx_etc_directory }}/nginx.conf"
    owner: root
    group: root
    mode: "0644"
  notify: "Validate Nginx configuration"

- name: "Ensuring sites-available directory exists"
  ansible.builtin.file:
    path: "{{ nginx_etc_directory }}/sites-available"
    state: directory
    mode: "0755"

- name: "Ensuring sites-enabled directory exists"
  ansible.builtin.file:
    path: "{{ nginx_etc_directory }}/sites-enabled"
    state: directory
    mode: "0755"

- name: "Ensuring www directory exists"
  ansible.builtin.file:
    path: "{{ nginx_www_directory }}"
    state: directory
    mode: "0755"

- name: "Ensuring log directory exists"
  ansible.builtin.file:
    path: "{{ nginx_log_directory }}"
    state: directory
    mode: "0755"

- name: "Ensuring correct SELinux context"
  ansible.builtin.command:
    cmd: "restorecon -Rv {{ nginx_www_directory }}"
  register: nginx_restorecon
  changed_when: false
  failed_when: nginx_restorecon.rc != 0
  when:
    - ansible_facts["virtualization_type"] | default("") not in ["docker", "podman", "lxc"]
    - ansible_selinux.status | default("disabled") == "enabled"

###############################################################################
# ENSURING FILESYSTEM CONFIGURATION
###############################################################################

- name: "Ensuring bind mount configuration is present"
  ansible.builtin.include_tasks: bind_present.yml
  when: (iac_blueprint.nginx.binds | default([])) | length > 0
  vars:
    iac_fs_binds: "{{ iac_blueprint.nginx.binds | default([]) }}"

- name: "Ensuring filesystem configuration is present"
  ansible.builtin.include_tasks: fs_present.yml
  when: (iac_blueprint.nginx.directories | default([])) | length > 0 or (iac_blueprint.nginx.files | default([])) | length > 0
  vars:
    iac_fs_directories: "{{ iac_blueprint.nginx.directories | default([]) }}"
    iac_fs_files: "{{ iac_blueprint.nginx.files | default([]) }}"

###############################################################################
# ENSURING CRONJOB CONFIGURATION
###############################################################################

- name: "Ensuring cron configuration is present"
  ansible.builtin.include_tasks: cron_present.yml
  when: iac_blueprint.nginx.cron is defined
  vars:
    iac_cron: "{{ iac_blueprint.nginx.cron | default([]) }}"
