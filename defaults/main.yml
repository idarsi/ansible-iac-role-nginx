---
###############################################################################
#
# DEFAULT CONFIGURATION FOR THE ROLE
#
# Warning! Do not edit this file but set configuration in inventory,
# playbook or as commandline parameter with ansible-playbook command
#
###############################################################################

http_proxy: ""
https_proxy: ""
no_proxy: ""

iac_service_name: "nginx"

iac_supported_os:
  - { name: "Rocky", versions: ["9", "10"] }
  - { name: "RedHat", versions: ["9", "10"] }

###############################################################################
# DNF related configurations
###############################################################################

# main package name
iac_dnf_main_package: "nginx"

# if this is true it skips creating repo if main package is already available
iac_dnf_skip_repo_if_package_available: true

# repository name
iac_dnf_repo_name: "nginx-stable"

# repository filepath
iac_dnf_repo_path: "/etc/yum.repos.d/nginx.repo"
# Legacy aliases retained for existing inventories.
dnf_sslverify: true
dnf_validate_certs: true
dnf_disable_gpg_check: false
iac_dnf_sslverify: "{{ dnf_sslverify }}"
iac_dnf_validate_certs: "{{ dnf_validate_certs }}"
iac_dnf_disable_gpg_check: "{{ dnf_disable_gpg_check }}"

###############################################################################
# Ansible report on target host
###############################################################################

iac_ansible_report: true
iac_ansible_report_tasks_path: "/root/ansible-report.log"

nginx_etc_directory: "/etc/nginx"
nginx_log_directory: "/var/log/nginx"
nginx_www_directory: "/var/www"
nginx_public_key_directory: "/etc/pki/tls/certs"
nginx_private_key_directory: "/etc/pki/tls/private"
nginx_certificate_public_key_days: 365

nginx_default_site_autoconfigure: website
nginx_default_ssl_certificate_type: selfsigned
nginx_proxy_ssl_verify: true


# Uninstall is deliberately opt-in because it can remove application data.
nginx_uninstall_confirm: false
nginx_uninstall_remove_config: false
nginx_management_directory: "/var/lib/ansible-iac-role-nginx"
nginx_management_marker: "/var/lib/ansible-iac-role-nginx/MANAGED_BY_ROLE"
nginx_management_manifest: "/var/lib/ansible-iac-role-nginx/manifest.yml"

nginx_supported_states:
  - "validate"
  - "install"
  - "present"
  - "absent"
  - "uninstall"
  - "site_present"
  - "site_absent"
  - "site_enabled"
  - "site_disabled"
  - "location_present"
  - "location_absent"
  - "started"
  - "stopped"
