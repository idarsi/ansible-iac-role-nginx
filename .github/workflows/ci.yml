---
name: "CI"
on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 3 * * 6"
  workflow_dispatch:
jobs:
  checks:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683" # v4.2.2
        with:
          submodules: "recursive"
      - uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065" # v5.6.0
        with:
          python-version: "3.12"
      - name: "Install test tools"
        run: "python -m pip install --requirement requirements.txt"
      - name: "Install Ansible collections"
        run: "ansible-galaxy collection install --requirements-file requirements.yml"
      - name: "Validate documentation inventory example"
        run: "ansible-inventory --list --inventory docs/inventory-example.yml --playbook-dir ."
      - name: "Syntax check documentation playbook example"
        run: "ANSIBLE_ROLES_PATH=.. ansible-playbook --syntax-check --inventory docs/inventory-example.yml docs/playbook-example.yml"
      - name: "Syntax check"
        run: "ansible-playbook --syntax-check -i localhost, -c local molecule/podman-validation/converge.yml"
      - name: "Lint"
        run: "ANSIBLE_ROLES_PATH=.. ansible-lint --profile production"
      - name: "Validation scenario"
        run: "molecule test -s podman-validation"
      - name: "Guardrail scenario"
        run: "molecule test -s podman-guardrails"
      - name: "Lifecycle scenario"
        run: "molecule test -s podman-lifecycle"
      - name: "Check-mode scenario"
        run: "molecule test -s podman-check-mode"
      - name: "Functional scenario"
        run: "molecule test -s podman-functional"

  platform-matrix:
    if: "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683" # v4.2.2
        with:
          submodules: "recursive"
      - uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065" # v5.6.0
        with:
          python-version: "3.12"
      - name: "Install test tools"
        run: "python -m pip install --requirement requirements.txt"
      - name: "Install Ansible collections"
        run: "ansible-galaxy collection install --requirements-file requirements.yml"
      - name: "Rocky Linux platform matrix"
        run: "molecule test -s podman-platform-matrix"
